<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quora sign up</title>
</head>
<body>
    
<fieldset style="background-color: rgb(23, 23, 23); width: 500px; margin: auto; height: 450px;">

    <form action="">
        <br>


        <h2 style="color: white;">Sign up</h2>
        <label for="What"> <h4 style="color: white;">Name</h4> </label> <br>
        <input type="text" style="width: 250px;height: 25px; background-color: black; color: rgb(162, 158, 158);width: 500px; " name="What" id="What" placeholder="What would you like to be called? ">
    <br><br>
    
    <label for="Your email"> <h4 style="color: white;">Email</h4></label>
    <input type="email" style="width: 250px; height: 25px;background-color: black; color: rgb(162, 158, 158); width: 500px;" placeholder="Your email" name="Your" id="Your email" > <br><br><br><br><br><br><hr>
    <button style="border-radius: 10px; background-color: rgb(65, 184, 235); color: white; border: transparent solid; border: 2px; width: 50px; float: right; margin-right: 20px;">Next</button>
      
</form>
</fieldset>
</body>
</html>
