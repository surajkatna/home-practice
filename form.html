<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram form</title>
    <style>
        a{
            display: inline-block;
            text-align: center;
            padding-top: 2.5px;
            padding-bottom: 2.5px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <fieldset style="width: 30%; height: 500px; border: 1px solid rgb(0, 129, 193); margin: auto;">
        <legend><h1 style="font-family: Brush Script MT; font-size: 3em; color: rgb(0, 129, 193);">Log into Instagram</h1></legend>
        <form action="">
    <input type="text" placeholder="Mobile number, username or email" style="width: 300px; height: 30px; border-radius: 10px;"><br><br>
    <input type="password" placeholder="Password" style="width: 300px; height: 30px; border-radius: 10px;"><br><br>
    <button style="width: 300px; height: 30px; border-radius: 10px; background-color: rgb(0, 110, 255); border: 1px solid transparent; color: white;">LogIn</button><br><br>
    <a href="https://www.instagram.com/accounts/password/reset/?hl=en"  style="width: 300px; border-radius: 10px; background-color: rgb(0, 0, 0); border: 1px solid transparent; color: white;">Forgot Password?</a><br><br>
    <a href="https://www.facebook.com/login" style="width: 300px; border-radius: 10px; background-color: rgb(140, 140, 140); border: 1px solid transparent; color: white;">Login with facebook</a><br><br>
    <a href="https://www.instagram.com/accounts/emailsignup/?next=&hl=en" style="width: 300px; border-radius: 10px;  border: 1px solid  rgb(0, 110, 255); color:  rgb(0, 110, 255);">Create new account</a>
    </form>
    
    </fieldset>
    
</body>
</html>
