<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form practise</title>
    <style>a{
            display: inline-block;
            text-align: center;
            padding-top: 2.5px;
            padding-bottom: 2.5px;
            text-decoration: none;
        }</style>
</head>
<body>
    <fieldset style="width: 400px;">
        <legend style="font-family: cursive;";"><h1>Instagram Login</h1></legend>
    <form action="">

        <input type="text"placeholder="Mobile number,Username or E-mail id" style="width: 250px;border-radius: 10px"><br><br>
        <input type="password" placeholder="password"style="width: 250px; border-radius : 10px;"><br><br>

        <button style="width:250px; border-radius: 10px;background-color: rgb(56, 100, 234);">Login</button><br><br>

       <a href="https://www.instagram.com/accounts/password/reset/?hl=en"
       style="width: 250px;border-radius: 10px; background-color: black; color: white;" >Forget password</a>
       <br><br>
       <a href="https://www.facebook.com/login"style="width: 250px;border-radius: 10px; background-color: black; color: white;" >login with facebook</a>
       <br><br>
       <a href="https://www.instagram.com/accounts/emailsignup/?next=&hl=en"style="width: 250px;border-radius: 10px; background-color: black; color: white;" >Create new account</a>
    
    </form>
</fieldset>
</body>
</html>
